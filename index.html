<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f4f6f9;color:#222;font-size:15px}
nav{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 20px;height:56px;gap:8px;flex-wrap:nowrap}
.logo{font-size:20px;font-weight:800;color:#2563eb;text-decoration:none;white-space:nowrap}
.nav-tabs{display:flex;gap:4px;flex:1;overflow:hidden}
.nav-tab{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#64748b;white-space:nowrap}
.nav-tab.active,.nav-tab:hover{background:#eff6ff;color:#2563eb}
.nav-right{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #2563eb;color:#2563eb;background:#fff;white-space:nowrap}
.btn-sm:hover{background:#2563eb;color:#fff}
.layout{display:flex;min-height:calc(100vh - 56px)}
aside{width:210px;flex-shrink:0;background:#fff;border-right:1px solid #e2e8f0;padding:16px 0;overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
.sidebar-section{padding:0 12px;margin-bottom:4px}
.sidebar-label{font-size:11px;font-weight:700;color:#94a3b8;padding:8px 4px 4px;display:block}
.sidebar-item{display:flex;align-items:center;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:500;color:#475569;cursor:pointer;gap:6px}
.sidebar-item:hover{background:#f1f5f9;color:#1e40af}
.sidebar-item.active{background:#eff6ff;color:#2563eb;font-weight:700}
.sidebar-badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.sidebar-divider{border:none;border-top:1px solid #e2e8f0;margin:8px 12px}
.round-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:2px 0 8px}
.round-tab{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#64748b}
.round-tab.active{border-color:#2563eb;background:#eff6ff;color:#2563eb}
.round-tab.disabled{opacity:.45;cursor:not-allowed}
main{flex:1;padding:24px;max-width:820px}
.page-header{margin-bottom:20px}
.page-header h1{font-size:22px;font-weight:800;color:#1e293b}
.page-header p{font-size:13px;color:#64748b;margin-top:4px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#475569}
.filter-btn.active,.filter-btn:hover{border-color:#2563eb;background:#eff6ff;color:#2563eb}
.progress-card{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;border:1px solid #e2e8f0;display:flex;align-items:center;gap:16px}
.progress-info{flex:1}
.progress-info h3{font-size:14px;font-weight:700;color:#1e293b;margin-bottom:6px}
.pbar-wrap{background:#e2e8f0;border-radius:8px;height:8px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:8px;transition:width .4s}
.progress-text{font-size:12px;color:#64748b;margin-top:4px}
.progress-stats{display:flex;gap:16px}
.stat{text-align:center}
.stat-num{font-size:22px;font-weight:800;color:#2563eb}
.stat-label{font-size:11px;color:#94a3b8;font-weight:600}
.q-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;margin-bottom:16px;overflow:hidden}
.q-header{display:flex;align-items:center;padding:14px 18px 0;gap:10px}
.q-num{font-size:12px;font-weight:700;background:#eff6ff;color:#2563eb;padding:3px 9px;border-radius:6px}
.q-actions{display:flex;gap:6px;margin-left:auto;align-items:center}
.btn-icon{width:30px;height:30px;border:none;background:transparent;cursor:pointer;border-radius:6px;font-size:16px}
.btn-icon:hover{background:#f1f5f9}
.btn-icon.bookmarked{color:#f59e0b}
.btn-resolve{padding:4px 10px;border-radius:6px;background:#f0fdf4;color:#16a34a;border:1.5px solid #86efac;font-size:12px;font-weight:700;cursor:pointer}
.btn-resolve:hover{background:#16a34a;color:#fff}
.btn-edit-q{padding:4px 10px;border-radius:6px;background:#fef9c3;color:#a16207;border:1.5px solid #fde047;font-size:12px;font-weight:700;cursor:pointer}
.q-body{padding:14px 18px}
.q-text{font-size:15px;font-weight:600;line-height:1.65;color:#1e293b;margin-bottom:10px}
.q-condition{background:#f8fafc;border-left:3px solid #93c5fd;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:12px;font-size:14px;color:#334155;white-space:pre-wrap;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{padding:10px 14px;border-radius:10px;border:1.5px solid #e2e8f0;cursor:pointer;font-size:14px;line-height:1.5;text-align:left;background:#fff;width:100%}
.choice:hover:not([disabled]){border-color:#93c5fd;background:#f0f9ff}
.choice.correct{border-color:#22c55e!important;background:#f0fdf4!important;color:#166534;font-weight:600}
.choice.wrong{border-color:#ef4444!important;background:#fef2f2!important;color:#991b1b}
.explanation{margin-top:14px;padding:14px 16px;background:#fffbeb;border-radius:10px;border:1px solid #fde68a;font-size:14px;line-height:1.7;color:#451a03;display:none}
.explanation.show{display:block}
.explanation-title{font-size:12px;font-weight:700;color:#92400e;margin-bottom:6px}
.q-footer{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 18px 16px;gap:12px}
.q-nums{display:flex;flex-direction:column;gap:4px;flex:1}
.q-nums-row{display:flex;gap:3px;flex-wrap:wrap}
.qn{width:28px;height:24px;border-radius:5px;background:#e2e8f0;cursor:pointer;border:none;font-size:11px;font-weight:700;color:#64748b}
.qn:hover{background:#bfdbfe;color:#1e40af}
.qn.answered{background:#bbf7d0;color:#166534}
.qn.wrong-q{background:#fecaca;color:#991b1b}
.qn.current{background:#2563eb;color:#fff}
.btn-next{padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;align-self:flex-end}
.btn-next:hover{background:#1d4ed8}
.empty{text-align:center;padding:60px 20px;color:#94a3b8}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:800;margin-bottom:16px}
.fg{margin-bottom:14px}
.fg label{font-size:13px;font-weight:600;color:#475569;margin-bottom:5px;display:block}
.fg textarea,.fg input,.fg select{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-primary{padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.btn-secondary{padding:8px 20px;background:#f1f5f9;color:#475569;border:none;border-radius:8px;font-weight:700;cursor:pointer}
@media(max-width:700px){aside{display:none}main{padding:12px}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="#">기출허브</a>

</nav>
<div class="layout">
  <aside id="sidebar"></aside>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div id="searchBar" style="padding:12px 24px 0;background:#f4f6f9">
      <div style="position:relative;max-width:440px">
        <input id="searchInput" type="text" placeholder="🔍 키워드 검색 (예: 토지, 임대차, 등기...)"
          style="width:100%;padding:8px 36px 8px 16px;border-radius:20px;border:1.5px solid #e2e8f0;font-size:13px;font-family:inherit;background:#fff;outline:none"
          oninput="doSearch(this.value)">
        <button id="searchClearBtn" onclick="doSearch('')" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:15px;color:#94a3b8">✕</button>
      </div>
      <div id="searchMsg" style="font-size:13px;color:#2563eb;font-weight:600;padding:4px 4px 0;min-height:20px"></div>

<div class="modal-overlay" id="editModal">

    <div class="fg"><label>문제</label><input type="text" id="eNum" readonly></div>
    <div class="fg"><label>문제 텍스트</label><textarea id="eQ" rows="3"></textarea></div>
    <div class="fg"><label>조건</label><textarea id="eCond" rows="2"></textarea></div>
    <div id="eChoices"></div>
    <div class="fg"><label>정답</label>
      <select id="eAns"><option value="1">① 1번</option><option value="2">② 2번</option><option value="3">③ 3번</option><option value="4">④ 4번</option><option value="5">⑤ 5번</option></select>
    </div>
    <div class="fg"><label>해설</label><textarea id="eExp" rows="4"></textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeEdit()">취소</button>
      <button class="btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>
